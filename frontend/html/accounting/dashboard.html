<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhasebe Paneli | AI Dershane Sistemi</title>
    <!-- Premium Google Fonts & Style -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --primary-light: #1e293b;
            --accent: #10b981;         /* Emerald Green for Finance */
            --accent-blue: #3b82f6;
            --bg-body: #f8fafc;
            --white: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.08), 0 2px 8px -1px rgba(15, 23, 42, 0.04);
            --gradient: linear-gradient(135deg, #10b981, #3b82f6);
            --glass-border: rgba(226, 232, 240, 0.8);
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            background: var(--bg-body); 
            padding: 20px; 
            color: var(--text-main); 
            margin: 0; 
            min-height: 100vh;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }

        /* Navigation Header */
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--white);
            padding: 1.25rem 2rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            border: 1px solid var(--glass-border);
        }
        .header-logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logout-btn { 
            background: #fee2e2; 
            color: var(--danger); 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 0.85rem; 
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background: var(--danger);
            color: var(--white);
        }

        /* Widgets Grid */
        .widgets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .widget-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .widget-card label {
            display: block;
            font-size: 0.78rem;
            text-transform: uppercase;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .widget-card span {
            font-size: 1.85rem;
            font-weight: 900;
            color: var(--primary);
        }

        /* Content Card */
        .section-card { 
            background: var(--white); 
            padding: 2rem; 
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow); 
            border: 1px solid var(--glass-border);
            margin-bottom: 25px;
        }
        h3 { 
            color: var(--primary); 
            font-size: 1.25rem; 
            font-weight: 800;
            margin-top: 0; 
            margin-bottom: 1.5rem; 
            border-bottom: 1.5px solid #f1f5f9;
            padding-bottom: 10px;
        }

        /* Table */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: var(--text-muted); font-size: 0.8rem; padding: 12px 10px; border-bottom: 2px solid #f1f5f9; text-transform: uppercase; font-weight: 700; }
        td { padding: 12px 10px; border-bottom: 1px solid #f1f5f9; font-size: 0.95rem; font-weight: 500; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: #f8fafc; }

        .btn-action {
            text-decoration: none;
            background: var(--white);
            color: var(--accent-blue);
            border: 1.5px solid var(--accent-blue);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            transition: all 0.2s;
            display: inline-block;
            cursor: pointer;
        }
        .btn-action:hover {
            background: var(--accent-blue);
            color: var(--white);
        }
        
        .btn-create-plan {
            color: var(--accent);
            border-color: var(--accent);
        }
        .btn-create-plan:hover {
            background: var(--accent);
            color: var(--white);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--glass-border);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: var(--radius-sm);
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            outline: none;
        }
        .btn-submit {
            background: var(--gradient);
            color: var(--white);
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
        }
    </style>
    <script src="/js/config.js"></script>
</head>
<body>

<div class="container">
    <!-- Navbar -->
    <div class="header-nav">
        <div class="header-logo">
            <span>💸</span> MUHASEBE PANELİ
        </div>
        <div>
            <a href="#" onclick="logout()" class="logout-btn">Çıkış Yap</a>
        </div>
    </div>

    <!-- Widgets -->
    <div class="widgets-grid">
        <div class="widget-card" style="border-left: 4px solid var(--accent-blue);">
            <label>Toplam Alacak Ciro</label>
            <span id="stat-projected">... TL</span>
        </div>
        <div class="widget-card" style="border-left: 4px solid var(--accent);">
            <label>Tahsil Edilen Tutar</label>
            <span id="stat-collected" style="color:var(--accent);">... TL</span>
        </div>
        <div class="widget-card" style="border-left: 4px solid var(--warning);">
            <label>Bekleyen Tahsilat</label>
            <span id="stat-outstanding" style="color:var(--warning);">... TL</span>
        </div>
        <div class="widget-card" style="border-left: 4px solid var(--danger);">
            <label>Gecikmiş Taksit Sayısı</label>
            <span id="stat-overdue" style="color:var(--danger);">... adet</span>
        </div>
    </div>

    <!-- Student billing list -->
    <div class="section-card">
        <h3>👥 Öğrenci Faturalandırma & Ödeme Planları Listesi</h3>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Öğrenci Adı Soyadı</th>
                        <th>Sınıf / Okul</th>
                        <th>Veli Adı & Telefon</th>
                        <th>Ödeme Planı Durumu</th>
                        <th>İşlemler</th>
                    </tr>
                </thead>
                <tbody id="student-billing-body">
                    <tr><td colspan="5" style="text-align:center; color:var(--text-muted)">Yükleniyor...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Create Payment Plan Modal -->
<div class="modal-overlay" id="planModal">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h4 style="margin:0; font-size:1.15rem; font-weight:800; color:var(--primary)">Yeni Ödeme Planı Tanımla</h4>
            <button onclick="closePlanModal()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
        </div>
        <form id="paymentPlanForm" onsubmit="submitPaymentPlan(event)">
            <input type="hidden" id="modal-student-id">
            <div class="form-group">
                <label>Toplam Eğitim Ücreti (TL)</label>
                <input type="number" id="plan-total" placeholder="Ör: 60000" required>
            </div>
            <div class="form-group">
                <label>İndirim Oranı (%)</label>
                <input type="number" id="plan-discount" placeholder="Ör: 10" min="0" max="100" value="0">
            </div>
            <div class="form-group">
                <label>Taksit Sayısı</label>
                <input type="number" id="plan-installments" placeholder="Ör: 5" min="1" max="12" value="3" required>
            </div>
            <div class="form-group">
                <label>İlk Ödeme Tarihi (Taksit Başlangıcı)</label>
                <input type="date" id="plan-start" required>
            </div>
            <button type="submit" class="btn-submit">Ödeme Planını Oluştur ve Taksitlendir</button>
        </form>
    </div>
</div>

<script>
const token = localStorage.getItem("token");

if (!token) {
    location.href = "/";
}

function logout() {
    localStorage.clear();
    location.href = "/";
}

// Load financial stats
function loadStats() {
    fetch(`${window.API_BASE}/api/accounting/dashboard_stats`, {
        headers: { "Authorization": "Bearer " + token }
    })
    .then(res => res.json())
    .then(stats => {
        document.getElementById("stat-projected").innerText = stats.total_projected.toLocaleString('tr-TR') + " TL";
        document.getElementById("stat-collected").innerText = stats.total_collected.toLocaleString('tr-TR') + " TL";
        document.getElementById("stat-outstanding").innerText = stats.total_outstanding.toLocaleString('tr-TR') + " TL";
        document.getElementById("stat-overdue").innerText = stats.overdue_count + " Taksit";
    })
    .catch(err => console.error("Error loading stats:", err));
}

// Load students and their payment statuses
function loadStudentsBilling() {
    fetch(`${window.API_BASE}/api/clerk/students`, {
        headers: { "Authorization": "Bearer " + token }
    })
    .then(res => res.json())
    .then(async students => {
        const tbody = document.getElementById("student-billing-body");
        if (students.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted)">Kayıtlı öğrenci bulunmuyor.</td></tr>`;
            return;
        }
        
        // Load details for each student
        const rows = await Promise.all(students.map(async s => {
            const planRes = await fetch(`${window.API_BASE}/api/accounting/payment_plans/${s.id}`, {
                headers: { "Authorization": "Bearer " + token }
            });
            const planData = await planRes.json();
            
            let statusLabel = "";
            let actionBtn = "";
            
            if (planData.plan) {
                const totalPaid = planData.installments.filter(i => i.is_paid).length;
                const totalInst = planData.installments.length;
                statusLabel = `<span style="color:var(--accent); font-weight:700;">Taksitlendirildi (${totalPaid}/${totalInst} Ödendi)</span>`;
                actionBtn = `<a href="odeme_takip.html?student_id=${s.id}" class="btn-action">Detay / Tahsilat</a>`;
            } else {
                statusLabel = `<span style="color:var(--danger); font-weight:700;">Plan Oluşturulmadı</span>`;
                actionBtn = `<button onclick="openPlanModal(${s.id})" class="btn-action btn-create-plan">Plan Oluştur</button>`;
            }
            
            return `
                <tr>
                    <td><strong>${s.first_name} ${s.last_name}</strong></td>
                    <td>${s.class_code || 'Sınıfsız'} / ${s.school_name || '-'}</td>
                    <td>${s.parent_name || '-'} <br><span style="font-size:0.8rem; color:var(--text-muted)">${s.parent_phone || '-'}</span></td>
                    <td>${statusLabel}</td>
                    <td>${actionBtn}</td>
                </tr>
            `;
        }));
        
        tbody.innerHTML = rows.join('');
    })
    .catch(err => console.error("Error loading billing list:", err));
}

// Plan Modal Operations
function openPlanModal(studentId) {
    document.getElementById("modal-student-id").value = studentId;
    
    // Set default date to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById("plan-start").value = today;
    
    document.getElementById("planModal").style.display = "flex";
}

function closePlanModal() {
    document.getElementById("planModal").style.display = "none";
}

// Submit payment plan form
function submitPaymentPlan(event) {
    event.preventDefault();
    
    const studentId = parseInt(document.getElementById("modal-student-id").value);
    const total = parseFloat(document.getElementById("plan-total").value);
    const discount = parseFloat(document.getElementById("plan-discount").value || 0);
    const installments = parseInt(document.getElementById("plan-installments").value);
    const start = document.getElementById("plan-start").value;
    
    const payload = {
        student_id: studentId,
        total_price: total,
        discount_rate: discount,
        installment_count: installments,
        start_date: start
    };
    
    fetch(`${window.API_BASE}/api/accounting/payment_plans`, {
        method: "POST",
        headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) {
            alert(data.error);
            return;
        }
        closePlanModal();
        loadStudentsBilling();
        loadStats();
    })
    .catch(err => {
        console.error("Error creating payment plan:", err);
        alert("Bağlantı hatası!");
    });
}

// Init
loadStats();
loadStudentsBilling();
</script>
</body>
</html>
