# Firebase App Hosting config.
# Bu dosya apps/web (backend'in rootDirectory olarak ayarlanacağı klasör) içinde bulunur.
# Referans: firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Vite VITE_ öneki ile başlayan değişkenler BUILD sırasında bundle'a gömülür.
# Bunlar Firebase web config değerleridir (public/istemci tarafı bilgiler,
# gizli anahtar değildir — Firestore güvenliği rules ile sağlanır).
env:
  - variable: VITE_FIREBASE_API_KEY
    value: "BURAYA_FIREBASE_API_KEY_GIRIN"
    availability:
      - BUILD
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: "evdedersapp.firebaseapp.com"
    availability:
      - BUILD
  - variable: VITE_FIREBASE_PROJECT_ID
    value: "evdedersapp"
    availability:
      - BUILD
  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: "evdedersapp.firebasestorage.app"
    availability:
      - BUILD
  - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
    value: "695385379153"
    availability:
      - BUILD
  - variable: VITE_FIREBASE_APP_ID
    value: "1:695385379153:web:fdb25b376adf766ca74370"
    availability:
      - BUILD
